allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')

    // Fix for receive_sharing_intent using kotlin DSL without applying kotlin plugin
    // and requiring compileSdk 37 which may not be installed
    afterEvaluate {
        if (project.name == "receive_sharing_intent" && project.hasProperty("android")) {
            project.android {
                compileSdk 35
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

